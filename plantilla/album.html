<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITULO}} · {{SITIO}}</title>
<meta name="description" content="{{DESCRIPCION}}">
<meta name="theme-color" content="{{COLOR}}">
<meta name="robots" content="noindex">
<meta property="og:title" content="{{TITULO}}">
<meta property="og:description" content="{{DESCRIPCION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="{{PORTADA}}">
<link rel="stylesheet" href="../../assets/estilos.css">
<link rel="icon" href="../../assets/icono.svg" type="image/svg+xml">
</head>
<body data-raiz="../../">

<header class="portada" id="portada" style="--color:{{COLOR}}">
  <nav class="barra-sup">
    <a href="../../" aria-label="Ver todos nuestros viajes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 4 3 6.5v14L9 18l6 2.5 6-2.5V4l-6 2.5L9 4Zm0 0v14m6-11.5v14"/></svg>
      Nuestros viajes
    </a>
  </nav>
  <img src="{{PORTADA}}" alt="" fetchpriority="high">
  <div class="texto">
    <div class="antetitulo" id="p-ante"></div>
    <h1 class="titulo" id="p-titulo">{{TITULO}}</h1>
    <div class="lugares" id="p-lugares"></div>
    <div class="fechas" id="p-fechas"></div>
  </div>
  <svg class="bajar" viewBox="0 0 28 40" fill="none" stroke="#fff" stroke-width="1.2" aria-hidden="true"><rect x="1" y="1" width="26" height="38" rx="13"/><path d="M14 9v8"/></svg>
</header>

<main>
  <section class="intro aparece" id="intro"></section>
  <div id="galeria"></div>
</main>

<footer class="pie-pag aparece">
  <svg class="corazon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6h2c.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
  <div><a class="volver" href="../../">Ver todos nuestros viajes</a></div>
</footer>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Visor de fotos">
  <div class="pista" id="pista"><div class="diapo"></div><div class="diapo"></div><div class="diapo"></div></div>
  <div class="cab"><span class="cont" id="v-cont"></span>
    <button class="cerrar" id="v-cerrar" aria-label="Cerrar"><svg width="22" height="22" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4" fill="none"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
  <button class="flecha ant" id="v-ant" aria-label="Anterior"><svg width="28" height="28" viewBox="0 0 24 24" stroke="#fff" stroke-width="1.2" fill="none"><path d="M15 4 7 12l8 8"/></svg></button>
  <button class="flecha sig" id="v-sig" aria-label="Siguiente"><svg width="28" height="28" viewBox="0 0 24 24" stroke="#fff" stroke-width="1.2" fill="none"><path d="m9 4 8 8-8 8"/></svg></button>
  <div class="pie"><span class="lug" id="v-lug"></span><span class="fec" id="v-fec"></span></div>
</div>

<script>window.ALBUM = {{DATOS}};</script>
<script src="../../assets/album.js"></script>
</body>
</html>
