<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enlaces NFC · {{TITULO}}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f3ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilos.css">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
</head>
<body>
<header class="inicio-cab" style="padding-bottom:20px">
  <div class="antetitulo">Para grabar en las etiquetas</div>
  <h1 class="titulo" style="font-size:clamp(2.6rem,12vw,4.5rem)">Enlaces NFC</h1>
  <p class="resumen" style="margin-top:10px">Pulsa «Copiar» y pégalo en NFC Tools → Escribir → URL</p>
</header>
<main class="enlaces" id="lista"></main>
<footer class="pie-pag"><a class="volver" href="./">Volver al mapa</a></footer>
<script>window.SITIO = {{DATOS}};</script>
<script>
(function () {
  var base = location.href.replace(/[#?].*$/, "").replace(/enlaces(\.html)?$/, "");
  var filas = [{ titulo: "Página principal (mapa)", url: "", img: null }].concat(
    window.SITIO.viajes.map(function (v) { return { titulo: v.titulo + " · " + v.anio, url: v.url, img: v.portada.m }; }));
  var lista = document.getElementById("lista");
  filas.forEach(function (f) {
    var full = base + f.url;
    var d = document.createElement("div"); d.className = "enlace";
    if (f.img) { var i = document.createElement("img"); i.src = f.img; i.alt = ""; i.loading = "lazy"; d.appendChild(i); }
    var t = document.createElement("div"); t.className = "txt";
    var b = document.createElement("b"); b.textContent = f.titulo;
    var c = document.createElement("code"); c.textContent = full;
    t.appendChild(b); t.appendChild(c); d.appendChild(t);
    var btn = document.createElement("button"); btn.textContent = "Copiar";
    btn.addEventListener("click", function () {
      var ok = function () { btn.textContent = "Copiado"; setTimeout(function () { btn.textContent = "Copiar"; }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(full).then(ok, function () { prompt("Copia el enlace:", full); });
      else prompt("Copia el enlace:", full);
    });
    d.appendChild(btn); lista.appendChild(d);
  });
})();
</script>
</body>
</html>
